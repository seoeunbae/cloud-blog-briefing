<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cloud Blog Briefing V2 - GCP Documentation RAG Chatbot</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="GCP Documentation RAG Chatbot & Relational Knowledge Graph Dashboard documentation site.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Docsify Premium Simple Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      /* Theme color overrides to match V2 dashboard */
      --theme-color: #e5a93b; /* Premium Amber/Gold */
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --heading-font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Dark mode glassmorphism palette */
      --base-background: #0f172a; /* Slate 900 */
      --sidebar-background: rgba(15, 23, 42, 0.85);
      --sidebar-border-color: rgba(255, 255, 255, 0.08);
      --sidebar-width: 280px;
      
      --link-color: #3b82f6; /* Sapphire link */
      --link-color--hover: #60a5fa;
      
      --code-inline-background: rgba(255, 255, 255, 0.06);
      --code-block-background: #1e293b; /* Slate 800 */
      
      --table-row-odd-background: rgba(255, 255, 255, 0.02);
      --table-row-even-background: rgba(255, 255, 255, 0.04);
      --table-border-color: rgba(255, 255, 255, 0.08);
    }

    /* Customize layout for high fidelity dark theme */
    body {
      background-color: var(--base-background) !important;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar Glassmorphism */
    .sidebar {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--sidebar-border-color) !important;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
    }
    
    .sidebar-nav strong {
      color: rgba(255, 255, 255, 0.85) !important;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 1.8rem;
      display: inline-block;
    }

    .sidebar-nav ul li a {
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 0.95rem;
      padding: 8px 12px !important;
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-nav ul li a:hover {
      color: #fff !important;
      background: rgba(255, 255, 255, 0.05);
      padding-left: 18px !important;
    }

    .sidebar-nav ul li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600 !important;
      background: rgba(229, 169, 59, 0.12) !important;
      border-right: 3px solid var(--theme-color);
    }

    /* Markdown styling tweaks */
    .markdown-section {
      max-width: 860px !important;
      padding: 3rem 20px 5rem 20px !important;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      font-family: var(--heading-font-family);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .markdown-section h1 {
      font-size: 2.5rem !important;
      color: #ffffff !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
      margin-bottom: 2rem;
    }

    .markdown-section h2 {
      font-size: 1.8rem !important;
      color: #f1f5f9 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 0.5rem;
      margin-top: 3rem !important;
    }

    .markdown-section h3 {
      font-size: 1.35rem !important;
      color: #e2e8f0 !important;
      margin-top: 2rem !important;
    }

    .markdown-section p, .markdown-section li {
      line-height: 1.8 !important;
      color: #cbd5e1 !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Glassmorphic Search Bar */
    .search input {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 8px !important;
      color: #fff !important;
      transition: all 0.2s ease !important;
      padding: 8px 12px 8px 30px !important;
    }

    .search input:focus {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 12px rgba(229, 169, 59, 0.15) !important;
    }

    /* Alert formatting in Docsify */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color) !important;
      background: rgba(229, 169, 59, 0.05) !important;
      color: #cbd5e1 !important;
      padding: 12px 20px !important;
      border-radius: 0 8px 8px 0 !important;
      margin: 1.5rem 0 !important;
    }
    
    /* Center images nicely */
    .markdown-section img {
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <div id="app">불러오는 중... (Loading...)</div>
  
  <script>
    window.$docsify = {
      name: 'Cloud Blog Briefing V2',
      repo: 'seoeunbae/cloud-blog-briefing',
      loadSidebar: true,
      autoHeader: true,
      subMaxLevel: 2,
      maxLevel: 3,
      
      // Full Text Search config
      search: {
        maxAge: 86400000, // Expiration time in ms, default one day
        paths: 'auto',
        placeholder: '검색어를 입력하세요...',
        noData: '검색 결과가 없습니다.',
        depth: 6
      },
      
      // Pagination config
      pagination: {
        previousText: '이전 페이지',
        nextText: '다음 페이지',
        crossChapter: true,
        crossChapterText: true
      },
      
      // Copy Code config
      copyCode: {
        buttonText : '복사',
        errorText  : '오류',
        successText: '복사됨'
      }
    }
  </script>
  
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Docsify Themeable Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Zoom Image Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  
  <!-- Copy Code Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Pagination Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- Prism Language Syntax Highlighting Support -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
